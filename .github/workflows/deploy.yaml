name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Backup Database for mitigations worst case
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.BACKUP_DIR }}

            echo "Starting DB backup..."

            TIMESTAMP=$(date +%F_%H-%M-%S)
            FILE="backup_$TIMESTAMP.sql"

            mysqldump \
              -u ${{ secrets.DB_USER }} \
              -p${{ secrets.DB_PASS }} \
              --no-tablespaces \
              ${{ secrets.DB_NAME }} > $FILE

            echo "Backup created: $FILE"

            find . -type f -name "*.sql" -mtime +7 -delete

      - name: Execute remote git pull and remigrate database, cache view, route, and configuration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.APP_DIR }}

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S git pull origin production

            # php artisan migrate --pretend
            # php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
